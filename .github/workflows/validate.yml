name: Repository integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Book, links, math, and import archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run math syntax regression tests
        run: python -m unittest discover -s tests
      - name: Validate book inventory, checksums, links, and math
        run: python scripts/validate_repository.py
      - name: Verify reproducible import archive
        run: python scripts/build_import.py --check
